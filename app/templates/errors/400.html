{% extends "base.html" %}

{% block title %}Bad Request - KMIE{% endblock %}

{% block content %}
<div class="page-container error-page">
    <div class="card error-card">
        <div class="error-code">400</div>
        <h1 class="error-title">Bad Request</h1>
        <p class="error-desc">{{ message or "The submitted request was malformed or expired. Please return to the homepage and try again." }}</p>
        <div class="error-actions">
            <a href="{{ url_for('public.index') }}" class="btn btn-primary">Return to Homepage</a>
        </div>
    </div>
</div>
{% endblock %}
